name: skypeanut
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.6.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  get: ^4.7.2
  responsive_sizer: ^3.3.1
  pin_code_fields: ^8.0.1
  google_nav_bar: ^5.0.7
  country_code_picker: ^3.1.0
  shared_preferences: ^2.3.3
  flutter_svg: ^2.0.14
  connectivity_plus: ^6.1.1
  http: ^1.2.2
  cached_network_image: ^3.4.1
  fluttertoast: ^8.2.8
  image_picker: ^1.1.0
  image_cropper: ^8.1.0
  shimmer: ^3.0.0
  simple_gradient_text: ^1.3.0
  smooth_page_indicator: ^1.2.0+3
  animated_text_kit: ^4.2.2
  permission_handler: ^11.3.1
  win32: ^5.10.0
  flutter_neumorphic_plus: ^3.4.0
  flutter_map: ^6.1.0
  flutter_inappwebview: ^6.1.5
  geolocator: ^13.0.3
  intl: ^0.18.1
  speech_to_text: ^7.0.0
  flutter_stripe: ^11.5.0
  dropdown_search: ^6.0.0
  google_places_flutter: ^2.0.9
  geocoding: ^2.0.5
  share_plus: ^10.0.0
  url_launcher: ^6.2.3
  firebase_messaging: ^15.0.3
  firebase_core: ^3.13.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  uuid: ^4.5.1
  google_maps_flutter: ^2.8.0
  timezone: ^0.10.1        # ✅ Change from ^0.9.4 to ^0.10.1
  flutter_timezone: ^2.0.0
  flutter_local_notifications: ^19.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0



flutter:


  uses-material-design: true




  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/



  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700




